[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution options
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=src/mower
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
    --durations=10

# Test markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    hardware: Tests that require physical hardware
    simulation: Tests that run in simulation mode
    slow: Tests that take a long time to run (>30s)
    network: Tests that require network connectivity
    safety: Safety-critical system tests
    performance: Performance and benchmark tests
    regression: Regression tests for known issues

# Test timeouts
timeout = 300
timeout_method = thread

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:adafruit_circuitpython_*
    ignore::UserWarning:RPi.*
    error::UserWarning:mower.*

# Coverage configuration
[coverage:run]
source = src/mower
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*
    */build/*
    */dist/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov